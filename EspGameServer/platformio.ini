; JC3248W535EN touchscreen client
[platformio]
description = Tic-tac-toe touchscreen client
default_envs = LVGL-320-480
boards_dir = boards
data_dir = littlefs
lib_dir = libraries
src_dir = src

[env:LVGL-320-480]
platform = espressif32@6.6.0
board = 320x480
framework = espidf
build_type = debug
upload_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
build_flags =
    -D LOG_LOCAL_LEVEL=ESP_LOG_VERBOSE
    -D LV_CONF_INCLUDE_SIMPLE
    -I src
